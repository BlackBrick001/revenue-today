<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Revenue Today</title>
<style>
  :root {
    --bg:#ebe6df; --card:#e2ddd5; --row:#e7e2da; --row-alt:#dfd9d0; --line:#cbc5bb; --ink:#1c1c1a; --muted:#5f5d58;
    --red:#e05252; --amber:#f0a030; --green:#3cbf6a; --dark:#1c1c1a;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.4 "Segoe UI", system-ui, -apple-system, sans-serif; }
  .wrap { max-width:1100px; margin:0 auto; padding:0 28px 48px; }
  header { padding:28px 0 18px; border-bottom:1px solid var(--line); margin-bottom:22px; }
  h1 { margin:0; font-size:24px; display:flex; gap:12px; align-items:center; }
  .meta { margin-top:6px; color:var(--muted); font-size:13px; display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .meta .upd { color:var(--green); }
  .badge { background:var(--amber); color:#fff; border-radius:4px; padding:1px 6px; font-size:11px; font-weight:600; }
  .panel { border:1.5px dashed var(--line); border-radius:12px; padding:20px 22px; display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap; margin-bottom:26px; }
  .panel b { display:block; font-size:15px; }
  .panel span { font-size:12px; color:var(--muted); }
  .btn { background:var(--dark); color:#fff; border:0; border-radius:6px; padding:10px 18px; font:inherit; font-weight:600; cursor:pointer; display:inline-flex; gap:8px; align-items:center; }
  .btn.light { background:transparent; color:var(--ink); border:1px solid var(--line); padding:6px 12px; font-weight:500; }
  .btn:disabled { opacity:.5; cursor:wait; }
  details { margin-bottom:26px; }
  summary { list-style:none; cursor:pointer; display:flex; align-items:center; gap:10px; font-weight:700; letter-spacing:.04em; color:#4a4844; font-size:15px; margin-bottom:12px; }
  summary::-webkit-details-marker { display:none; }
  summary .chev { transition:transform .15s; display:inline-block; font-size:12px; }
  details:not([open]) summary .chev { transform:rotate(-90deg); }
  .cards { display:grid; grid-template-columns:repeat(auto-fit, minmax(160px, 1fr)); gap:12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 14px 12px; }
  .card.total { border-color:#8f8a82; }
  .card h3 { margin:0 0 6px; font-size:11px; letter-spacing:.06em; font-weight:700; }
  .donut { display:flex; justify-content:center; margin:4px 0 10px; position:relative; }
  .donut .lbl { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .donut .lbl b { font-size:15px; } .donut .lbl small { font-size:9px; color:var(--muted); }
  .rr { display:flex; justify-content:space-between; font-size:11px; }
  .big { font-size:17px; font-weight:700; margin:2px 0 6px; }
  .bar { height:4px; border-radius:3px; margin-bottom:14px; }
  .two { display:grid; grid-template-columns:1fr 1fr; font-size:11px; gap:2px 6px; }
  .two b { font-size:13px; }
  .d { font-size:10px; }
  .up { color:var(--green); } .down { color:var(--red); }
  .foot { border-top:1px solid var(--line); margin-top:10px; padding-top:8px; display:flex; gap:12px; font-size:11px; }
  .foot b { display:block; font-size:13px; font-weight:500; }
  .table { border:1px solid var(--line); border-radius:12px; overflow:auto; }
  table { width:100%; border-collapse:collapse; font-size:13px; min-width:760px; }
  th, td { padding:10px 16px; text-align:right; white-space:nowrap; }
  th:first-child, td:first-child { text-align:left; }
  thead th { font-weight:700; border-bottom:1px solid var(--line); background:var(--row); }
  tbody tr:nth-child(odd) { background:var(--row-alt); } tbody tr:nth-child(even) { background:var(--row); }
  td:last-child, th:last-child { font-weight:700; }
  tr.sub td { font-weight:700; background:var(--row) !important; border-top:1px solid var(--line); }
  .pos { color:var(--green); font-weight:600; } .neg { color:var(--red); font-weight:600; }
  .tiles { display:flex; gap:12px; margin-bottom:14px; flex-wrap:wrap; }
  .tile { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 18px; min-width:240px; }
  .tile span { font-size:11px; letter-spacing:.05em; } .tile b { display:block; font-size:22px; margin-top:4px; }
  input.tgt { width:110px; padding:4px 6px; border:1px solid var(--line); border-radius:4px; font:inherit; text-align:right; background:#f5f2ed; }
  .err { background:#f6dada; color:#8a2020; border-radius:8px; padding:10px 14px; margin-bottom:16px; font-size:13px; }
  .note { font-size:12px; color:var(--muted); margin-top:8px; }
  .loading { padding:40px; text-align:center; color:var(--muted); }
  @media (max-width:640px) { .wrap { padding:0 16px 40px; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>Revenue Today</h1>
    <div class="meta" id="meta">Loading…</div>
  </header>

  <div class="panel">
    <div><b>Live from Mews</b><span id="panelNote">Data comes straight from the Mews API. A snapshot is saved every night for pick-up.</span></div>
    <button class="btn" id="refresh">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
      Refresh from Mews
    </button>
  </div>

  <div id="errors"></div>
  <div id="app"><div class="loading">Fetching data from Mews… this can take up to a minute the first time.</div></div>
</div>

<script>
const API = ''; // same origin (Vercel serverless functions under /api)
let DATA = null, editingTargets = false;

// ---------- formatting ----------
const grp = (n) => Math.round(Math.abs(n)).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
const R = (n) => (n == null || isNaN(n)) ? '—' : (n < 0 ? 'R-' : 'R') + grp(n);
const pct = (n) => (n == null || isNaN(n)) ? '—' : n.toFixed(1) + '%';
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
const trend = (n) => n == null || isNaN(n) ? '—' : `<span class="${n >= 0 ? 'pos' : 'neg'}">${n >= 0 ? '↗' : '↘'}R${grp(n)}</span>`;
const pick = (n) => n == null || isNaN(n) ? '—' : `<span class="${n >= 0 ? 'pos' : 'neg'}">${n >= 0 ? '+R' : 'R-'}${grp(n)}</span>`;
const delta = (n) => n == null || isNaN(n) ? '' : `<span class="d ${n >= 0 ? 'up' : 'down'}">${n >= 0 ? '▲' : '▼'} R${grp(n)}</span>`;
const occColor = (o) => o >= 75 ? 'var(--green)' : o >= 56 ? 'var(--amber)' : 'var(--red)';
const longDate = (ymd) => new Date(ymd + 'T12:00:00Z').toLocaleDateString('en-GB', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
const monthHead = (ym) => new Date(ym + '-01T12:00:00Z').toLocaleDateString('en-GB', { month:'short' }) + ' 01';

// ---------- metrics ----------
const ratios = (x) => ({
  occ: x.aum ? 100 * x.sold / x.aum : null,
  adr: x.sold ? x.rev / x.sold : null,
  revpar: x.aum ? x.rev / x.aum : null,
});
const sum = (list, f) => list.reduce((a, p) => a + (f(p) ?? 0), 0);
const sumNullable = (list, f) => list.some((p) => f(p) == null) ? null : sum(list, f);
const addUp = (list, key) => ['rev','fnb','sold','aum','ooo'].reduce((o, k) => (o[k] = sum(list, (p) => p[key][k]), o), {});

function groupOf(props) {
  return {
    name: 'Group Total', isTotal: true,
    today: addUp(props, 'today'), yesterday: addUp(props, 'yesterday'),
    mtd: { rev: sum(props, p => p.mtd.rev), lastMonth: sum(props, p => p.mtd.lastMonth), lastYear: sum(props, p => p.mtd.lastYear), fnbYest: sum(props, p => p.mtd.fnbYest) },
    full: { ...addUp(props, 'full'), lastMonthRev: sum(props, p => p.full.lastMonthRev), stly: sum(props, p => p.full.stly), fnbYesterday: sum(props, p => p.full.fnbYesterday) },
    pickup: props[0].pickup.map((_, i) => ({ month: props[0].pickup[i].month, yesterday: sumNullable(props, p => p.pickup[i].yesterday), today: sum(props, p => p.pickup[i].today) })),
    fnbPickup: sumNullable(props, p => p.fnbPickup),
    target: sumNullable(props, p => p.target), // group target only once every property has one
  };
}

// ---------- rendering ----------
function donut(occ) {
  const r = 22, c = 2 * Math.PI * r, v = Math.max(0, Math.min(occ || 0, 100));
  return `<div class="donut"><svg width="58" height="58" viewBox="0 0 58 58">
    <circle cx="29" cy="29" r="${r}" fill="none" stroke="transparent" stroke-width="4"/>
    <circle cx="29" cy="29" r="${r}" fill="none" stroke="${occColor(v)}" stroke-width="4" stroke-linecap="round"
      stroke-dasharray="${c * v / 100} ${c}" transform="rotate(-90 29 29)"/></svg>
    <div class="lbl"><b>${occ == null ? '—' : Math.round(occ) + '%'}</b><small>OCC</small></div></div>`;
}

function todayCards(cols) {
  const maxRev = Math.max(...cols.filter(c => !c.isTotal).map(c => c.today.rev), 1);
  return `<div class="cards">${cols.map((p) => {
    const t = ratios(p.today), y = ratios(p.yesterday);
    const w = p.isTotal ? 100 : Math.max(4, 100 * p.today.rev / maxRev);
    return `<div class="card ${p.isTotal ? 'total' : ''}">
      <h3>${esc(p.name.toUpperCase())}</h3>
      ${donut(t.occ)}
      <div class="rr"><span>Room Rev</span>${delta(p.today.rev - p.yesterday.rev)}</div>
      <div class="big">${R(p.today.rev)}</div>
      <div class="bar" style="width:${w}%;background:${occColor(t.occ || 0)}"></div>
      <div class="two"><span>ADR</span><span>RevPAR</span>
        <b>${R(t.adr)}</b><b>${R(t.revpar)}</b>
        ${delta(t.adr != null && y.adr != null ? t.adr - y.adr : null) || '<span></span>'}${delta(t.revpar != null && y.revpar != null ? t.revpar - y.revpar : null) || '<span></span>'}</div>
      <div class="foot"><div>AUM<b>${p.today.aum}</b></div><div>OOO<b class="${p.today.ooo > 1 ? 'down' : ''}">${p.today.ooo}${p.today.ooo > 1 ? ' ⚠' : ''}</b></div></div>
    </div>`;
  }).join('')}</div>`;
}

function table(cols, rows) {
  return `<div class="table"><table><thead><tr><th>Metric</th>${cols.map(c => `<th>${esc(c.name)}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(([label, f]) => `<tr><td>${label}</td>${cols.map(c => `<td>${f(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}

function section(id, icon, title, body) {
  return `<details open id="${id}"><summary><span class="chev">▼</span>${icon}${title}</summary>${body}</details>`;
}

function render() {
  const d = DATA;
  const props = d.properties.filter(p => !p.error);
  const cols = [...props, groupOf(props)];
  const g = cols[cols.length - 1];
  const lyYear = d.months.ly.slice(0, 4);

  document.getElementById('meta').innerHTML =
    `<span class="upd">◷ Last updated ${new Date(d.generatedAt).toLocaleString('en-GB', { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' })}</span>
     · Data for ${longDate(d.today)} · Revenue ${esc(d.revenueBasis)}
     ${d.environment !== 'production' ? '<span class="badge">DEMO DATA</span>' : ''}`;

  document.getElementById('errors').innerHTML = d.properties.filter(p => p.error)
    .map(p => `<div class="err"><b>${esc(p.name)}</b> could not be loaded: ${esc(p.error)}</div>`).join('');

  const today = section('s-today', '↗ ', 'TODAY', todayCards(cols));

  const yest = section('s-yest', '▮ ', 'YESTERDAY', table(cols, [
    ['AUM', c => c.yesterday.aum],
    ['Occ%', c => pct(ratios(c.yesterday).occ)],
    ['Room Revenue', c => R(c.yesterday.rev)],
    ['ADR (Ex F&B)', c => R(ratios(c.yesterday).adr)],
    ['RevPAR (Ex F&B)', c => R(ratios(c.yesterday).revpar)],
    ['Out of Order', c => c.yesterday.ooo],
  ]));

  const mtd = section('s-mtd', '$ ', 'MONTH TO DATE', table(cols, [
    ['Revenue MTD', c => R(c.mtd.rev)],
    ['vs Last Month', c => trend(c.mtd.rev - c.mtd.lastMonth)],
    ['Last Month MTD', c => R(c.mtd.lastMonth)],
    ['vs Last Year', c => c.mtd.lastYear ? trend(c.mtd.rev - c.mtd.lastYear) : '—'],
    ['Last Year MTD', c => R(c.mtd.lastYear)],
    ['F&B MTD (Yest.)', c => R(c.mtd.fnbYest)],
  ]));

  const targetCell = (c) => {
    if (!editingTargets || c.isTotal) return R(c.target);
    return `<input class="tgt" data-prop="${esc(c.name)}" value="${c.target ?? ''}" inputmode="numeric">`;
  };
  const fr = (c) => ratios(c.full);
  const full = section('s-full', '▦ ', 'FULL MONTH', `
    <div class="tiles">
      <div class="tile"><span>GROUP TOTAL REVENUE</span><b>${R(g.full.rev)}</b></div>
      <div class="tile"><span>VS TARGET (GROUP)</span><b>${g.target ? trend(g.full.rev - g.target) : '—'}</b></div>
    </div>
    ${table(cols, [
      ['Occ% This Month', c => pct(fr(c).occ)],
      ['ADR This Month', c => R(fr(c).adr)],
      ['RevPAR This Month', c => R(fr(c).revpar)],
      ['Total Room Revenue', c => R(c.full.rev)],
      ['vs Last Month', c => trend(c.full.rev - c.full.lastMonthRev)],
      ['vs Target', c => c.target ? trend(c.full.rev - c.target) : '—'],
      [`Same Time ${lyYear}`, c => R(c.full.stly)],
      [`Target <button class="btn light" id="editT" style="margin-left:8px">${editingTargets ? 'Save' : 'Edit'}</button>`, targetCell],
      ['F&B (Yesterday)', c => R(c.full.fnbYesterday)],
      ['F&B Pick up/Loss', c => pick(c.fnbPickup)],
    ])}`);

  const pickupRows = d.properties.length && props.length ? props[0].pickup.map((_, i) => `
      <tr class="sub"><td>${monthHead(props[0].pickup[i].month)}</td>${cols.map(c => `<td>${esc(c.name)}</td>`).join('')}</tr>
      <tr><td>Yesterday OTB</td>${cols.map(c => `<td>${R(c.pickup[i].yesterday)}</td>`).join('')}</tr>
      <tr><td>Today OTB</td>${cols.map(c => `<td>${R(c.pickup[i].today)}</td>`).join('')}</tr>
      <tr><td>Pick Up/Loss</td>${cols.map(c => `<td>${c.pickup[i].yesterday == null ? '—' : pick(c.pickup[i].today - c.pickup[i].yesterday)}</td>`).join('')}</tr>`).join('') : '';
  const pickup = section('s-pick', '↗ ', '3-MONTH DAILY PICK UP / LOSS', `
    <div class="table"><table><tbody>${pickupRows}</tbody></table></div>
    <div class="note">${d.snapshotDate ? `Compared with the snapshot saved on ${longDate(d.snapshotDate)}.` : 'No snapshot from a previous day yet. Pick-up starts showing from tomorrow.'}</div>`);

  // keep open/closed state across re-renders
  const openState = {};
  document.querySelectorAll('details').forEach(el => openState[el.id] = el.open);
  document.getElementById('app').innerHTML = today + yest + mtd + full + pickup;
  document.querySelectorAll('details').forEach(el => { if (el.id in openState) el.open = openState[el.id]; });

  document.getElementById('editT').onclick = async (e) => {
    e.preventDefault();
    if (editingTargets) {
      const values = {};
      document.querySelectorAll('input.tgt').forEach(i => values[i.dataset.prop] = i.value.replace(/[^\d.]/g, '') || null);
      await fetch(API + '/api/targets', { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify({ month: d.months.cur, values }) });
      props.forEach(p => p.target = values[p.name] == null ? null : Number(values[p.name]));
    }
    editingTargets = !editingTargets;
    render();
  };
}

async function load(force) {
  const btn = document.getElementById('refresh');
  btn.disabled = true;
  try {
    const r = await fetch(API + '/api/dashboard' + (force ? '?refresh=1' : ''));
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || r.statusText);
    DATA = j;
    render();
  } catch (e) {
    document.getElementById('errors').innerHTML = `<div class="err">${esc(e.message)}</div>`;
    if (!DATA) document.getElementById('app').innerHTML = '';
  } finally { btn.disabled = false; }
}
document.getElementById('refresh').onclick = () => load(true);
load(false);
</script>
</body>
</html>
